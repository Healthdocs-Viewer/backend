services:
  postgres:
    image: postgres:16-alpine
    container_name: healthdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthdocs}
      POSTGRES_USER: ${POSTGRES_USER:-healthdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthdocs_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

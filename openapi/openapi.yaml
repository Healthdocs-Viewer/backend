openapi: 3.1.0
info:
  title: Healthdocs Viewer API
  version: 0.1.0
  description: |
    Contrato inicial del MVP. Es la fuente única de verdad entre frontend y backend.
    Los archivos se transfieren directamente con URLs prefirmadas; la API no recibe el contenido binario.
servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: Obtiene el perfil autenticado
      operationId: getCurrentUser
      responses:
        '200':
          description: Perfil actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases:
    post:
      summary: Crea un caso para el paciente autenticado
      operationId: createCase
      responses:
        '201':
          description: Caso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: Lista los casos del paciente autenticado
      operationId: listMyCases
      responses:
        '200':
          description: Casos del paciente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{caseId}/uploads:
    post:
      summary: Crea una intención de carga de archivo de entrada
      operationId: createInputUpload
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadIntentRequest'
      responses:
        '201':
          description: URL temporal creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /files/{fileId}/complete:
    post:
      summary: Confirma que el navegador terminó una carga directa
      operationId: completeUpload
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Archivo registrado como recibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/cases:
    get:
      summary: Lista los casos habilitados para el usuario interno autenticado
      operationId: listAssignedCases
      responses:
        '200':
          description: Casos habilitados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalCaseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /internal/cases/{caseId}/files/{fileId}/download:
    post:
      summary: Crea una intención de descarga para un archivo habilitado
      operationId: createInputDownload
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: URL temporal creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/cases/{caseId}/result-uploads:
    post:
      summary: Crea una intención de carga de resultado externo
      operationId: createResultUpload
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadIntentRequest'
      responses:
        '201':
          description: URL temporal creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /operations/cases/{caseId}/assignments:
    post:
      summary: Habilita temporalmente un caso para un usuario interno
      description: Operación provisional para la primera demostración; el rol responsable definitivo sigue pendiente.
      operationId: assignCase
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Caso habilitado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /operations/results/{resultId}/availability:
    post:
      summary: Marca un resultado como disponible
      description: Operación provisional para la primera demostración; la regla y responsable definitivos siguen pendientes.
      operationId: makeResultAvailable
      parameters:
        - $ref: '#/components/parameters/ResultId'
      responses:
        '204':
          description: Resultado disponible y evento de notificación publicado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cases/{caseId}/result:
    get:
      summary: Obtiene una intención de descarga del resultado disponible del paciente
      operationId: getPatientResult
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Resultado disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResultId:
      name: resultId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Sesión ausente o inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El perfil no tiene permiso para la operación solicitada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: El recurso no existe o no puede ser consultado por el usuario
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    UserRole:
      type: string
      enum: [PATIENT, STUDENT, PROFESSOR, ADMIN]
    CaseStatus:
      type: string
      enum: [CREATED, FILES_RECEIVED, ENABLED_FOR_PROCESSING, RESULT_UPLOADED, RESULT_AVAILABLE]
    UserProfile:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    CaseSummary:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CaseStatus'
        createdAt:
          type: string
          format: date-time
    InternalCaseSummary:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          required: [files]
          properties:
            files:
              type: array
              items:
                $ref: '#/components/schemas/FileSummary'
    FileSummary:
      type: object
      required: [id, originalFilename, fileKind]
      properties:
        id:
          type: string
          format: uuid
        originalFilename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        fileKind:
          type: string
          enum: [INPUT, RESULT]
    CreateUploadIntentRequest:
      type: object
      required: [originalFilename, contentType]
      properties:
        originalFilename:
          type: string
          minLength: 1
        contentType:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
    UploadIntent:
      type: object
      required: [file, uploadUrl, expiresAt]
      properties:
        file:
          $ref: '#/components/schemas/FileSummary'
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    DownloadIntent:
      type: object
      required: [downloadUrl, expiresAt]
      properties:
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    PatientResult:
      type: object
      required: [id, caseId, availableAt, download]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        availableAt:
          type: string
          format: date-time
        download:
          $ref: '#/components/schemas/DownloadIntent'
    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string

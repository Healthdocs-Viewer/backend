openapi: 3.1.0
info:
  title: Healthdocs Viewer API
  version: 0.3.0
  description: |
    Contrato inicial del MVP. Es la fuente única de verdad entre frontend y backend.
    Los archivos se transfieren directamente con URLs prefirmadas; la API no recibe el contenido binario.

    Autenticación local de desarrollo con cuentas de prueba mediante POST /auth/login.
    No define la autenticación de producción. Las demás rutas requieren Authorization:
    Bearer <token>. El JWT firmado contiene sub (UserProfile.id), role (UserRole) y
    exp (expiración en segundos Unix). La identidad y el rol proceden del token validado.
    Los roles iniciales paciente, estudiante y profesor sustituyen en 0.2.0 los valores
    PATIENT, STUDENT, PROFESSOR y ADMIN; no existe un administrador inicial.

    Un paciente solo accede a sus casos. Estudiantes y profesores solo acceden a casos
    habilitados explícitamente para su usuario; el rol no concede acceso global.
    Las listas aplican los mismos filtros. Se verifica también que cada archivo o
    resultado pertenezca al caso autorizado antes de modificarlo o emitir URLs.
    401 indica credenciales incorrectas o token ausente, inválido o expirado.
    403 indica identidad autenticada sin rol, propiedad o habilitación requerida.
    Los errores no revelan propietarios, asignaciones ni datos de otros usuarios.
servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Inicia una sesión local de desarrollo
      description: |
        Solo desarrollo local con cuentas de prueba. No requiere un JWT previo.
        El servidor determina usuario y rol a partir de las credenciales; el cliente
        no puede seleccionar su rol. Devuelve 401 por credenciales incorrectas y
        403 si la cuenta autenticada no está habilitada o no tiene un rol inicial.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada; usar el token como credencial Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      summary: Obtiene el perfil autenticado
      operationId: getCurrentUser
      description: Paciente, estudiante o profesor; devuelve la identidad, el rol y el estado de habilitación de la cuenta autenticada.
      responses:
        '200':
          description: Perfil actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cases:
    post:
      summary: Crea un caso para el paciente autenticado
      operationId: createCase
      description: Solo paciente. El servidor establece al usuario autenticado como propietario.
      responses:
        '201':
          description: Caso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: Lista los casos del paciente autenticado
      operationId: listMyCases
      description: Solo paciente; devuelve únicamente casos propiedad del usuario autenticado.
      responses:
        '200':
          description: Casos del paciente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cases/{caseId}/consent:
    post:
      summary: Registra la aceptación del consentimiento informado
      operationId: acceptConsent
      description: |
        Solo paciente propietario de caseId. Persiste el consentimiento con un
        timestamp de aceptación y la versión de los términos aceptados.
        Si el paciente ya aceptó esta versión de los términos para este caso,
        devuelve 409. El caso debe existir y pertenecer al paciente autenticado.
        Este paso es obligatorio antes de solicitar la URL de carga de archivos.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptConsentRequest'
      responses:
        '201':
          description: Consentimiento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El consentimiento para esta versión de términos ya fue registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cases/{caseId}/uploads:
    post:
      summary: Crea una intención de carga de archivo de entrada
      operationId: createInputUpload
      description: Solo paciente propietario de caseId.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadIntentRequest'
      responses:
        '201':
          description: URL temporal creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /files/{fileId}/complete:
    post:
      summary: Confirma que el navegador terminó una carga directa
      operationId: completeUpload
      description: |
        Para INPUT, requiere paciente propietario del caso. Para RESULT, requiere
        estudiante o profesor habilitado para el caso. El servidor obtiene el caso
        y tipo desde fileId y verifica que el usuario haya iniciado la intención de carga.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Archivo registrado como recibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/cases:
    get:
      summary: Lista los casos habilitados para el usuario interno autenticado
      operationId: listAssignedCases
      description: Solo estudiante o profesor; lista únicamente casos habilitados para su usuario.
      responses:
        '200':
          description: Casos habilitados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalCaseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /internal/cases/{caseId}/files/{fileId}/download:
    post:
      summary: Crea una intención de descarga para un archivo habilitado
      operationId: createInputDownload
      description: Solo estudiante o profesor habilitado para caseId; fileId debe ser INPUT y pertenecer a ese caso.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: URL temporal creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/cases/{caseId}/result-uploads:
    post:
      summary: Crea una intención de carga de resultado externo
      operationId: createResultUpload
      description: Solo estudiante o profesor habilitado para caseId.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadIntentRequest'
      responses:
        '201':
          description: URL temporal creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /operations/cases/{caseId}/assignments:
    post:
      summary: Habilita temporalmente un caso para un usuario interno
      description: |
        Regla provisional de desarrollo local: solo profesor ya habilitado para caseId
        puede habilitar a otro estudiante o profesor. La habilitación inicial del profesor
        se prepara en los datos de prueba locales; el rol no permite acceder a casos ajenos.
        El rol responsable definitivo sigue pendiente de validación.
      operationId: assignCase
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Caso habilitado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /operations/results/{resultId}/availability:
    post:
      summary: Marca un resultado como disponible
      description: |
        Regla provisional de desarrollo local: solo profesor habilitado para el caso
        al que pertenece resultId. El servidor resuelve y verifica esa relación.
        La regla y el responsable definitivos siguen pendientes de validación.
      operationId: makeResultAvailable
      parameters:
        - $ref: '#/components/parameters/ResultId'
      responses:
        '204':
          description: Resultado disponible y evento de notificación publicado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cases/{caseId}/result:
    get:
      summary: Obtiene una intención de descarga del resultado disponible del paciente
      operationId: getPatientResult
      description: Solo paciente propietario de caseId; el resultado debe pertenecer a ese caso y estar disponible.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Resultado disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de POST /auth/login; enviar en Authorization como Bearer <token>.
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResultId:
      name: resultId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Credenciales incorrectas o token ausente, inválido o expirado; mensaje genérico sin revelar si la cuenta existe.
      headers:
        WWW-Authenticate:
          description: Desafío Bearer para recursos protegidos; no se requiere en el login.
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Identidad autenticada sin acceso habilitado, rol permitido, propiedad o habilitación del caso requerida; mensaje genérico sin datos de otros usuarios.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: El recurso no existe o no puede ser consultado por el usuario
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Correo de una cuenta de prueba local.
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          minLength: 1
          description: JWT firmado con sub igual a user.id, role igual a user.role y exp como expiración en segundos Unix.
        user:
          description: Usuario autenticado y su rol; comparte la estructura de GET /me.
          $ref: '#/components/schemas/UserProfile'
    UserRole:
      type: string
      description: Roles iniciales de desarrollo; valores transmitidos en minúsculas.
      enum: [paciente, estudiante, profesor]
    CaseStatus:
      type: string
      enum: [CREATED, FILES_RECEIVED, ENABLED_FOR_PROCESSING, RESULT_UPLOADED, RESULT_AVAILABLE]
    UserProfile:
      type: object
      required: [id, email, role, enabled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        enabled:
          type: boolean
          description: Indica si la cuenta está habilitada para operar.
    CaseSummary:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CaseStatus'
        createdAt:
          type: string
          format: date-time
    InternalCaseSummary:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          required: [files]
          properties:
            files:
              type: array
              items:
                $ref: '#/components/schemas/FileSummary'
    FileSummary:
      type: object
      required: [id, originalFilename, fileKind]
      properties:
        id:
          type: string
          format: uuid
        originalFilename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        fileKind:
          type: string
          enum: [INPUT, RESULT]
    CreateUploadIntentRequest:
      type: object
      required: [originalFilename, contentType]
      properties:
        originalFilename:
          type: string
          minLength: 1
        contentType:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
    UploadIntent:
      type: object
      required: [file, uploadUrl, expiresAt]
      properties:
        file:
          $ref: '#/components/schemas/FileSummary'
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    DownloadIntent:
      type: object
      required: [downloadUrl, expiresAt]
      properties:
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    PatientResult:
      type: object
      required: [id, caseId, availableAt, download]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        availableAt:
          type: string
          format: date-time
        download:
          $ref: '#/components/schemas/DownloadIntent'
    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
    AcceptConsentRequest:
      type: object
      additionalProperties: false
      required: [termsVersion]
      properties:
        termsVersion:
          type: string
          minLength: 1
          description: >
            Versión de los términos y condiciones que el paciente acepta,
            por ejemplo "1.0". El servidor rechaza versiones desconocidas con 400.
        acceptedAt:
          type: string
          format: date-time
          description: >
            Timestamp ISO-8601 en el que el paciente confirma la aceptación
            desde el cliente. Si se omite, el servidor usa su propio timestamp.
    ConsentRecord:
      type: object
      required: [id, caseId, termsVersion, acceptedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único del registro de consentimiento.
        caseId:
          type: string
          format: uuid
        termsVersion:
          type: string
          description: Versión de los términos aceptados.
        acceptedAt:
          type: string
          format: date-time
          description: Timestamp registrado en el servidor al momento de la aceptación.

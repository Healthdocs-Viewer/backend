spring:
  application:
    name: healthdocs-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthdocs}
    username: ${DB_USER:healthdocs}
    password: ${DB_PASSWORD:change_me_for_local_development}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-${AUTH_PROVIDER:disabled}
    fail-on-missing-locations: false
    validate-on-migrate: true
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}

healthdocs:
  internal:
    local-storage-path: ${HEALTHDOCS_LOCAL_STORAGE_PATH:${java.io.tmpdir}/healthdocs-storage}
    result-max-size-bytes: ${HEALTHDOCS_RESULT_MAX_SIZE_BYTES:104857600}
    result-allowed-mime-types: ${HEALTHDOCS_RESULT_ALLOWED_MIME_TYPES:application/pdf,video/mp4,application/dicom,application/zip}
    upload-ttl-minutes: ${HEALTHDOCS_STORAGE_UPLOAD_TTL_MINUTES:15}
    download-ttl-minutes: ${HEALTHDOCS_STORAGE_DOWNLOAD_TTL_MINUTES:10}
    base-url: ${HEALTHDOCS_STORAGE_BASE_URL:http://localhost:8080}

app:
  auth-provider: ${AUTH_PROVIDER:disabled}
  jwt:
    secret: ${JWT_SECRET:change_this_local_secret_to_at_least_32_bytes}
    expiration: ${JWT_EXPIRATION:3600}

auth:
  provider: ${AUTH_PROVIDER:${app.auth-provider:disabled}}
  jwt:
    secret: ${JWT_SECRET:${app.jwt.secret:change_this_local_secret_to_at_least_32_bytes}}
    issuer: ${JWT_ISSUER:healthdocs-default}
    expiration: PT1H
  cognito:
    region: ${COGNITO_REGION:us-east-1}
    user-pool-id: ${COGNITO_USER_POOL_ID:pool-id}
    client-id: ${COGNITO_CLIENT_ID:client-id}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///healthdocs
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  flyway:
    enabled: true

# El perfil test nunca habilita el proveedor local ni ejecuta seeders locales.
app:
  auth-provider: ${AUTH_PROVIDER:cognito}

auth:
  provider: ${AUTH_PROVIDER:cognito}
  cognito:
    region: ${COGNITO_REGION:test-region-1}
    user-pool-id: ${COGNITO_USER_POOL_ID:test-pool}
    client-id: ${COGNITO_CLIENT_ID:test-client}

spring:
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthdocs}
    username: ${DB_USER:healthdocs}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      data-locations: classpath:db/seed/local/V1__local_test_accounts.sql

app:
  auth-provider: ${AUTH_PROVIDER:local}

auth:
  provider: ${AUTH_PROVIDER:local}
  jwt:
    secret: ${JWT_SECRET:change_this_local_secret_to_at_least_32_bytes}
    issuer: ${JWT_ISSUER:healthdocs-dev}
    expiration: ${JWT_EXPIRATION:PT1H}
